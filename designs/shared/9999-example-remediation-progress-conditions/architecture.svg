<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-labelledby="svg-title">
  <title id="svg-title">Remediation progress conditions — component flow (worked example)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/>
    </marker>
  </defs>
  <rect width="720" height="260" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#1f2933">
    <rect x="20" y="100" width="130" height="60" rx="8" fill="#eef2f7" stroke="#52606d"/>
    <text x="85" y="126" text-anchor="middle">NHC</text>
    <text x="85" y="146" text-anchor="middle" font-size="12" fill="#52606d">creates &amp; watches</text>

    <rect x="220" y="100" width="160" height="60" rx="8" fill="#eef2f7" stroke="#52606d"/>
    <text x="300" y="126" text-anchor="middle">Remediation CR</text>
    <text x="300" y="146" text-anchor="middle" font-size="12" fill="#52606d">per target node</text>

    <rect x="450" y="40" width="250" height="60" rx="8" fill="#eef2f7" stroke="#52606d"/>
    <text x="575" y="66" text-anchor="middle">SNR · SBR · FAR · MDR</text>
    <text x="575" y="86" text-anchor="middle" font-size="12" fill="#52606d">remediation providers</text>

    <rect x="450" y="160" width="250" height="60" rx="8" fill="#eef2f7" stroke="#52606d"/>
    <text x="575" y="186" text-anchor="middle">Processing / Succeeded</text>
    <text x="575" y="206" text-anchor="middle" font-size="12" fill="#52606d">shared condition reasons</text>

    <line x1="150" y1="130" x2="218" y2="130" stroke="#52606d" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="380" y1="118" x2="448" y2="80" stroke="#52606d" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="380" y1="142" x2="448" y2="182" stroke="#52606d" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="575" y1="100" x2="575" y2="158" stroke="#52606d" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="450" y1="190" x2="90" y2="190" stroke="#52606d" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
    <line x1="90" y1="190" x2="85" y2="162" stroke="#52606d" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
  </g>
</svg>
